<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Optional. Prefer setting the background as the document Fill in Icon Composer
       (gradient #26292E to #0F1012, top to bottom). Use this file only if you want it as a layer. -->
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26292E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#asphalt)"/>
</svg>
